<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采集示例</title><link rel="stylesheet" href="/assets/studio.css?v=4"><link rel="stylesheet" href="/assets/polish.css?v=43"></head><body data-design="product"><main><a class="back-link" href="/assets/collection-guide.html">← 返回采集说明</a><h1 id="title">真实采集示例</h1><p>采集示意图；按画面中页签、字段和面板位置操作。</p><div id="example"></div></main><script type="module">import {realCaptureExample,collectionRequirements} from '/assets/collection-guide.js?v=7';const p=new URLSearchParams(location.search);const file=p.get('image');const allowed=new Map([...collectionRequirements.screenshotPages.map(v=>[v.file,'postgame']),['recording-loading.png','loading'],['recording-panel.png','panel'],['camp-replay.png','camp']]);if(allowed.has(file)){const label=p.get('label')||'真实采集示例';document.querySelector('#title').textContent=label;document.querySelector('#example').innerHTML=realCaptureExample(file,label,allowed.get(file));}</script></body></html>
